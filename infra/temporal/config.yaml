# Static Temporal server config for the production compose stack. The image does not template this file, so it
# holds no secrets: the database password comes from TEMPORAL_DB_PASSWORD through passwordCommand.
log:
  stdout: true
  level: info
persistence:
  numHistoryShards: 4
  defaultStore: default
  visibilityStore: visibility
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: temporal-postgres:5432
        connectProtocol: tcp
        user: temporal
        passwordCommand: { command: printenv, args: [TEMPORAL_DB_PASSWORD] }
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: 1h
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: temporal-postgres:5432
        connectProtocol: tcp
        user: temporal
        passwordCommand: { command: printenv, args: [TEMPORAL_DB_PASSWORD] }
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: 1h
global:
  membership:
    maxJoinDuration: 30s
    # All roles run in this one container. Explicit advertisement is required with wildcard listeners;
    # their internal membership/RPC traffic can use loopback while clients use the application network.
    broadcastAddress: "127.0.0.1"
services:
  # The server has application and database interfaces. Without an explicit bind it chooses only one,
  # which may be the database network and unreachable to the namespace step, API, worker and UI.
  frontend:
    rpc: { grpcPort: 7233, membershipPort: 6933, httpPort: 7243, bindOnIP: "0.0.0.0" }
  matching:
    rpc: { grpcPort: 7235, membershipPort: 6935, bindOnIP: "0.0.0.0" }
  history:
    rpc: { grpcPort: 7234, membershipPort: 6934, bindOnIP: "0.0.0.0" }
  worker:
    rpc: { grpcPort: 7239, membershipPort: 6939, bindOnIP: "0.0.0.0" }
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: localhost:7233
      httpAddress: localhost:7243
dcRedirectionPolicy:
  policy: noop
