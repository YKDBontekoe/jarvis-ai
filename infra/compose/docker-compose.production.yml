name: jarvis

services:
  postgres:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  temporal-postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_PASSWORD:?Set TEMPORAL_PASSWORD}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql
      - ../temporal/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [temporal-data]

  temporal:
    image: temporalio/auto-setup:latest@sha256:9be7b8d98f60d00f4f2ff74731c071a17848d8182bbc8429e314a24c94ea105b
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_PASSWORD:?Set TEMPORAL_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks: [application, temporal-data]

  temporal-ui:
    image: temporalio/ui:latest@sha256:3899d5cf749b5555c9f798d46f2423b1d6190ea391ca713db5d1bba961759e58
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_started
    networks: [application]

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: jarvis-files
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ${GARAGE_CONFIG_FILE:?Set GARAGE_CONFIG_FILE}:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks: [data]

  clamav:
    image: clamav/clamav:stable@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 5m
    networks: [application]

  livekit:
    image: livekit/livekit-server:latest@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
    volumes:
      - ../livekit/production.yaml:/etc/livekit.yaml:ro
    ports:
      # The host Caddy stack proxies public LiveKit signaling through this loopback port.
      - "127.0.0.1:7880:7880/tcp"
      - "${LIVEKIT_BIND_ADDRESS:-0.0.0.0}:7881:7881/tcp"
      - "${LIVEKIT_BIND_ADDRESS:-0.0.0.0}:50000-50100:50000-50100/udp"
    networks: [application]

  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest@sha256:2cf09d66a86fdd210e42ee91662216364acc27da1163a8c44167a77ea3a6559a
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
    mem_limit: 2g
    cpus: 1.0
    networks: [application]

  # Links WhatsApp as a companion device (scan a QR code in the app). Built from source on the host;
  # `pull_policy: build` rebuilds it on every `up`. Not published: only the API and worker reach it.
  whatsapp-bridge:
    image: ${JARVIS_WHATSAPP_BRIDGE_IMAGE:-ghcr.io/ykdbontekoe/jarvis-ai/whatsapp-bridge:latest}
    build:
      context: ../../workers/whatsapp-bridge
    pull_policy: build
    restart: unless-stopped
    environment:
      BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-https://8404fd3049a3ad459533f7630bc7be42@o4512185266339840.ingest.de.sentry.io/4512185388302416}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - whatsapp-bridge-data:/data
    mem_limit: 512m
    cpus: 0.5
    networks: [application]

  # Local embedding model for semantic memory search, on CPU. Text Embeddings Inference downloads the model from
  # Hugging Face on first start into the embeddings-data volume and serves an OpenAI-compatible /v1/embeddings
  # endpoint. The API and worker pick it up through Embeddings__*; an owner's own OpenRouter embedding model still
  # wins. Set EMBEDDINGS_BASE_URL= (empty) in the env file to switch it off.
  embeddings:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c}
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}", "--port", "80", "--auto-truncate"]
    environment:
      HF_HOME: /data
    volumes:
      - embeddings-data:/data
    mem_limit: 2g
    cpus: 2.0
    networks: [application]

  jarvis-api:
    image: ${JARVIS_API_IMAGE:-ghcr.io/ykdbontekoe/jarvis-ai/api:latest}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        PROJECT_PATH: src/Jarvis.Api/Jarvis.Api.csproj
    user: "${JARVIS_UID:?Set JARVIS_UID}:${JARVIS_GID:?Set JARVIS_GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /dev/shm:rw,nosuid,size=256m
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5082
      HOME: /tmp
      DataProtection__KeysDirectory: /var/lib/jarvis-data-protection-keys
      CODEX_HOME: /codex
      Codex__ExecutablePath: /usr/local/bin/codex
      Codex__ModelClasses__Fast: ${CODEX_MODEL_FAST:-}
      Codex__ModelClasses__Standard: ${CODEX_MODEL_STANDARD:-}
      Codex__ModelClasses__Reasoning: ${CODEX_MODEL_REASONING:-}
      Codex__ModelClasses__Coding: ${CODEX_MODEL_CODING:-}
      Codex__ModelClasses__Vision: ${CODEX_MODEL_VISION:-}
      Codex__ModelClasses__Realtime: ${CODEX_MODEL_REALTIME:-}
      Jarvis__ModelClass: ${JARVIS_MODEL_CLASS:-}
      Embeddings__BaseUrl: ${EMBEDDINGS_BASE_URL-http://embeddings:80/v1}
      Embeddings__Model: ${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      ConnectionStrings__jarvis: Host=postgres;Port=5432;Database=jarvis;Username=jarvis;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Database__ApplyMigrationsAtStartup: "false"
      Temporal__Address: temporal:7233
      ObjectStorage__ServiceUrl: http://garage:3900
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ObjectStorage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ObjectStorage__Bucket: jarvis-files
      ObjectStorage__Region: us-east-1
      ObjectStorage__MaxUploadBytes: ${MAX_UPLOAD_BYTES:-20971520}
      Antivirus__Host: clamav
      Antivirus__Port: 3310
      Antivirus__TimeoutSeconds: 60
      Authentication__Issuer: ${AUTH_ISSUER:?Set AUTH_ISSUER}
      Authentication__Audience: ${AUTH_AUDIENCE:?Set AUTH_AUDIENCE}
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY}
      Authentication__AllowRegistration: ${AUTH_ALLOW_REGISTRATION:-true}
      Cors__AllowedOrigins__0: ${JARVIS_WEB_ORIGIN:?Set JARVIS_WEB_ORIGIN}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      LiveKit__InternalUrl: http://livekit:7880
      LiveKit__PublicUrl: wss://${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}
      Voice__WorkerSecret: ${VOICE_WORKER_SECRET:?Set VOICE_WORKER_SECRET}
      Jarvis__PublicBaseUrl: ${JARVIS_WEB_ORIGIN:?Set JARVIS_WEB_ORIGIN}
      Channels__PublicBaseUrl: ${JARVIS_WEB_ORIGIN:?Set JARVIS_WEB_ORIGIN}
      Channels__Signal__BaseUrl: ${SIGNAL_CLI_REST_URL:-http://signal-cli:8080}
      Channels__WhatsAppBridge__BaseUrl: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3000}
      Channels__WhatsAppBridge__Token: ${WHATSAPP_BRIDGE_TOKEN:-}
      Push__FirebaseProjectId: ${FIREBASE_PROJECT_ID:-}
      Push__GoogleServiceAccountFile: /run/secrets/firebase-service-account.json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-https://8404fd3049a3ad459533f7630bc7be42@o4512185266339840.ingest.de.sentry.io/4512185388302416}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      Sentry__TracesSampleRate: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      Sentry__ProfilesSampleRate: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
      Sentry__RecordAiContent: ${SENTRY_RECORD_AI_CONTENT:-false}
    volumes:
      - ${CODEX_HOME_DIR:?Set CODEX_HOME_DIR}:/codex:rw
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-/dev/null}:/run/secrets/firebase-service-account.json:ro
      - ${JARVIS_DATA_PROTECTION_KEYS_DIR:?Set JARVIS_DATA_PROTECTION_KEYS_DIR}:/var/lib/jarvis-data-protection-keys:rw
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      garage:
        condition: service_healthy
      clamav:
        condition: service_healthy
      livekit:
        condition: service_started
      signal-cli:
        condition: service_started
      whatsapp-bridge:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [application, data]

  # One-shot deployment task. It is profile-gated so a normal `compose up` never
  # reruns migrations; remote-up invokes it explicitly before replacing the API.
  jarvis-migrate:
    profiles: [migration]
    image: ${JARVIS_API_IMAGE:-ghcr.io/ykdbontekoe/jarvis-ai/api:latest}
    command: ["Jarvis.Api.dll", "migrate"]
    restart: "no"
    read_only: true
    user: "${JARVIS_UID:?Set JARVIS_UID}:${JARVIS_GID:?Set JARVIS_GID}"
    environment:
      DOTNET_ENVIRONMENT: Production
      HOME: /tmp
      ConnectionStrings__jarvis: Host=postgres;Port=5432;Database=jarvis;Username=jarvis;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-https://8404fd3049a3ad459533f7630bc7be42@o4512185266339840.ingest.de.sentry.io/4512185388302416}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  jarvis-worker:
    image: ${JARVIS_WORKER_IMAGE:-ghcr.io/ykdbontekoe/jarvis-ai/worker:latest}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        PROJECT_PATH: workers/Jarvis.Worker/Jarvis.Worker.csproj
    command: ["Jarvis.Worker.dll"]
    user: "${JARVIS_UID:?Set JARVIS_UID}:${JARVIS_GID:?Set JARVIS_GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    environment:
      DOTNET_ENVIRONMENT: Production
      DataProtection__KeysDirectory: /var/lib/jarvis-data-protection-keys
      HOME: /tmp
      CODEX_HOME: /codex
      Codex__ExecutablePath: /usr/local/bin/codex
      Codex__ModelClasses__Fast: ${CODEX_MODEL_FAST:-}
      Codex__ModelClasses__Standard: ${CODEX_MODEL_STANDARD:-}
      Codex__ModelClasses__Reasoning: ${CODEX_MODEL_REASONING:-}
      Codex__ModelClasses__Coding: ${CODEX_MODEL_CODING:-}
      Codex__ModelClasses__Vision: ${CODEX_MODEL_VISION:-}
      Codex__ModelClasses__Realtime: ${CODEX_MODEL_REALTIME:-}
      Jarvis__ModelClass: ${JARVIS_MODEL_CLASS:-}
      Embeddings__BaseUrl: ${EMBEDDINGS_BASE_URL-http://embeddings:80/v1}
      Embeddings__Model: ${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      ConnectionStrings__jarvis: Host=postgres;Port=5432;Database=jarvis;Username=jarvis;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Temporal__Address: temporal:7233
      Channels__WhatsAppBridge__BaseUrl: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3000}
      Channels__WhatsAppBridge__Token: ${WHATSAPP_BRIDGE_TOKEN:-}
      ObjectStorage__ServiceUrl: http://garage:3900
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ObjectStorage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ObjectStorage__Bucket: jarvis-files
      ObjectStorage__Region: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-https://8404fd3049a3ad459533f7630bc7be42@o4512185266339840.ingest.de.sentry.io/4512185388302416}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      Sentry__TracesSampleRate: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      Sentry__ProfilesSampleRate: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
      Sentry__RecordAiContent: ${SENTRY_RECORD_AI_CONTENT:-false}
    volumes:
      - ${CODEX_HOME_DIR:?Set CODEX_HOME_DIR}:/codex:rw
      - ${JARVIS_DATA_PROTECTION_KEYS_DIR:?Set JARVIS_DATA_PROTECTION_KEYS_DIR}:/var/lib/jarvis-data-protection-keys:rw
    depends_on:
      jarvis-api:
        condition: service_healthy
      garage:
        condition: service_healthy
      temporal:
        condition: service_started
    networks: [application, data]

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:?Set JARVIS_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      jarvis-api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [edge, application]

networks:
  edge:
  application:
  data:
    internal: true
  temporal-data:
    internal: true

volumes:
  postgres-data:
  temporal-postgres-data:
  garage-meta:
  garage-data:
  clamav-signatures:
  caddy-data:
  caddy-config:
  signal-cli-data:
  whatsapp-bridge-data:
  embeddings-data:
