name: jarvis

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  temporal-postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_PASSWORD:?Set TEMPORAL_PASSWORD}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql
      - ../temporal/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [temporal-data]

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_PASSWORD:?Set TEMPORAL_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks: [application, temporal-data]

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_started
    networks: [application]

  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: jarvis-files
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ${GARAGE_CONFIG_FILE:?Set GARAGE_CONFIG_FILE}:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks: [data]

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 5m
    networks: [application]

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
    volumes:
      - ../livekit/production.yaml:/etc/livekit.yaml:ro
    ports:
      # The host Caddy stack proxies public LiveKit signaling through this loopback port.
      - "127.0.0.1:7880:7880/tcp"
      - "${LIVEKIT_BIND_ADDRESS:-0.0.0.0}:7881:7881/tcp"
      - "${LIVEKIT_BIND_ADDRESS:-0.0.0.0}:50000-50100:50000-50100/udp"
    networks: [application]

  jarvis-api:
    image: ${JARVIS_API_IMAGE:-ghcr.io/ykdbontekoe/jarvis-ai/api:latest}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        PROJECT_PATH: src/Jarvis.Api/Jarvis.Api.csproj
    user: "${JARVIS_UID:?Set JARVIS_UID}:${JARVIS_GID:?Set JARVIS_GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5082
      HOME: /tmp
      DataProtection__KeysDirectory: /var/lib/jarvis-data-protection-keys
      CODEX_HOME: /codex
      Codex__ExecutablePath: /usr/local/bin/codex
      Codex__ModelClasses__Fast: ${CODEX_MODEL_FAST:-}
      Codex__ModelClasses__Standard: ${CODEX_MODEL_STANDARD:-}
      Codex__ModelClasses__Reasoning: ${CODEX_MODEL_REASONING:-}
      Codex__ModelClasses__Coding: ${CODEX_MODEL_CODING:-}
      Codex__ModelClasses__Vision: ${CODEX_MODEL_VISION:-}
      Codex__ModelClasses__Realtime: ${CODEX_MODEL_REALTIME:-}
      Jarvis__ModelClass: ${JARVIS_MODEL_CLASS:-}
      ConnectionStrings__jarvis: Host=postgres;Port=5432;Database=jarvis;Username=jarvis;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Database__ApplyMigrationsAtStartup: "true"
      Temporal__Address: temporal:7233
      ObjectStorage__ServiceUrl: http://garage:3900
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ObjectStorage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ObjectStorage__Bucket: jarvis-files
      ObjectStorage__Region: us-east-1
      ObjectStorage__MaxUploadBytes: ${MAX_UPLOAD_BYTES:-20971520}
      Antivirus__Host: clamav
      Antivirus__Port: 3310
      Antivirus__TimeoutSeconds: 60
      Authentication__Issuer: ${AUTH_ISSUER:?Set AUTH_ISSUER}
      Authentication__Audience: ${AUTH_AUDIENCE:?Set AUTH_AUDIENCE}
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY}
      Authentication__AllowRegistration: ${AUTH_ALLOW_REGISTRATION:-true}
      Cors__AllowedOrigins__0: ${JARVIS_WEB_ORIGIN:?Set JARVIS_WEB_ORIGIN}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      LiveKit__InternalUrl: http://livekit:7880
      LiveKit__PublicUrl: wss://${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}
      Voice__WorkerSecret: ${VOICE_WORKER_SECRET:?Set VOICE_WORKER_SECRET}
      Jarvis__PublicBaseUrl: ${JARVIS_WEB_ORIGIN:?Set JARVIS_WEB_ORIGIN}
      Channels__PublicBaseUrl: ${JARVIS_WEB_ORIGIN:?Set JARVIS_WEB_ORIGIN}
      Channels__Signal__BaseUrl: ${SIGNAL_CLI_REST_URL:-}
      Push__FirebaseProjectId: ${FIREBASE_PROJECT_ID:-}
      Push__GoogleServiceAccountFile: /run/secrets/firebase-service-account.json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ${CODEX_HOME_DIR:?Set CODEX_HOME_DIR}:/codex:rw
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-/dev/null}:/run/secrets/firebase-service-account.json:ro
      - ${JARVIS_DATA_PROTECTION_KEYS_DIR:?Set JARVIS_DATA_PROTECTION_KEYS_DIR}:/var/lib/jarvis-data-protection-keys:rw
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      garage:
        condition: service_healthy
      clamav:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [application, data]

  jarvis-worker:
    image: ${JARVIS_WORKER_IMAGE:-ghcr.io/ykdbontekoe/jarvis-ai/worker:latest}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        PROJECT_PATH: workers/Jarvis.Worker/Jarvis.Worker.csproj
    command: ["Jarvis.Worker.dll"]
    user: "${JARVIS_UID:?Set JARVIS_UID}:${JARVIS_GID:?Set JARVIS_GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    environment:
      DOTNET_ENVIRONMENT: Production
      DataProtection__KeysDirectory: /var/lib/jarvis-data-protection-keys
      HOME: /tmp
      CODEX_HOME: /codex
      Codex__ExecutablePath: /usr/local/bin/codex
      Codex__ModelClasses__Fast: ${CODEX_MODEL_FAST:-}
      Codex__ModelClasses__Standard: ${CODEX_MODEL_STANDARD:-}
      Codex__ModelClasses__Reasoning: ${CODEX_MODEL_REASONING:-}
      Codex__ModelClasses__Coding: ${CODEX_MODEL_CODING:-}
      Codex__ModelClasses__Vision: ${CODEX_MODEL_VISION:-}
      Codex__ModelClasses__Realtime: ${CODEX_MODEL_REALTIME:-}
      Jarvis__ModelClass: ${JARVIS_MODEL_CLASS:-}
      ConnectionStrings__jarvis: Host=postgres;Port=5432;Database=jarvis;Username=jarvis;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Temporal__Address: temporal:7233
      ObjectStorage__ServiceUrl: http://garage:3900
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ObjectStorage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ObjectStorage__Bucket: jarvis-files
      ObjectStorage__Region: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ${CODEX_HOME_DIR:?Set CODEX_HOME_DIR}:/codex:rw
      - ${JARVIS_DATA_PROTECTION_KEYS_DIR:?Set JARVIS_DATA_PROTECTION_KEYS_DIR}:/var/lib/jarvis-data-protection-keys:rw
    depends_on:
      jarvis-api:
        condition: service_healthy
      garage:
        condition: service_healthy
      temporal:
        condition: service_started
    networks: [application, data]

  jarvis-voice-worker:
    image: ${JARVIS_VOICE_WORKER_IMAGE:-ghcr.io/ykdbontekoe/jarvis-ai/voice-worker:latest}
    build:
      context: ../..
      dockerfile: workers/voice/Dockerfile
    user: "${JARVIS_UID:?Set JARVIS_UID}:${JARVIS_GID:?Set JARVIS_GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    environment:
      HOME: /tmp
      CODEX_HOME: /codex
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      JARVIS_INTERNAL_API_URL: http://jarvis-api:5082
      VOICE_WORKER_SECRET: ${VOICE_WORKER_SECRET:?Set VOICE_WORKER_SECRET}
      CODEX_EXECUTABLE_PATH: /usr/local/bin/codex
      CODEX_MODEL: ${CODEX_MODEL_REALTIME:-}
      LOG_LEVEL: INFO
    volumes:
      - ${CODEX_HOME_DIR:?Set CODEX_HOME_DIR}:/codex:rw
    depends_on:
      jarvis-api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [application]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:?Set JARVIS_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      jarvis-api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [edge, application]

networks:
  edge:
  application:
  data:
    internal: true
  temporal-data:
    internal: true

volumes:
  postgres-data:
  temporal-postgres-data:
  garage-meta:
  garage-data:
  clamav-signatures:
  caddy-data:
  caddy-config:
