services:
  jarvis-api:
    environment:
      Mcp__Servers__home-assistant__Name: home-assistant
      Mcp__Servers__home-assistant__Transport: streamableHttp
      Mcp__Servers__home-assistant__Endpoint: "${HOME_ASSISTANT_MCP_URL:?Set HOME_ASSISTANT_MCP_URL to an HTTPS Home Assistant /api/mcp URL}"
      Mcp__Servers__home-assistant__CredentialProvider: home-assistant
      Mcp__Servers__home-assistant__CredentialHeaders__Authorization: token
      Mcp__Servers__home-assistant__CredentialHeaderPrefixes__Authorization: Bearer
      Mcp__Servers__home-assistant__AllowedTools__0: "*"
