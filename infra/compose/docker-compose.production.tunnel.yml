services:
  # The host Caddy instance routes both app hostnames through the existing
  # Cloudflare Tunnel. Keep Compose's direct internet edge available only when
  # the operator explicitly enables the direct-edge profile.
  caddy:
    profiles: [direct-edge]
    ports: !reset []

  jarvis-api:
    ports:
      - "127.0.0.1:15082:5082"
