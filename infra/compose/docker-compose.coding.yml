services:
  jarvis-api:
    environment:
      Coding__Repositories__0__Name: ${CODING_REPO_NAME:-jarvis}
      Coding__Repositories__0__Path: /coding/repo
      Coding__WorktreeRoot: /coding/worktrees
    volumes:
      - ${CODING_REPO_PATH:?Set CODING_REPO_PATH to a Git checkout}:/coding/repo
      - coding-worktrees:/coding/worktrees
  jarvis-worker:
    environment:
      Coding__Repositories__0__Name: ${CODING_REPO_NAME:-jarvis}
      Coding__Repositories__0__Path: /coding/repo
      Coding__WorktreeRoot: /coding/worktrees
    volumes:
      - ${CODING_REPO_PATH:?Set CODING_REPO_PATH to a Git checkout}:/coding/repo
      - coding-worktrees:/coding/worktrees

volumes:
  coding-worktrees:
