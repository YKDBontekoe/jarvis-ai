http_port 3128
pid_filename /run/squid/squid.pid
cache deny all
access_log none
cache_log /dev/stderr
pinger_enable off

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

acl jarvis_localhost dst 0.0.0.0/8 127.0.0.0/8 ::/128 ::1/128
# Squid normalizes IPv4-mapped IPv6 addresses to IPv4; the IPv4 ranges below cover private mappings.
# Blocking the whole ::ffff:0:0/96 range instead normalizes to 0.0.0.0/0 and blocks public IPv4 too.
acl to_private_networks dst 10.0.0.0/8 100.64.0.0/10 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
acl blocked_local_names dstdomain .localhost .local .internal .test .invalid .example metadata.google.internal

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_local_names
http_access deny jarvis_localhost
http_access deny to_private_networks
http_access allow all
