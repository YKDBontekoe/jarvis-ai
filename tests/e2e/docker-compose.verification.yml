services:
  identity:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: https://localhost:8443
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ../../artifacts/verification/realm.json:/opt/keycloak/data/import/jarvis-verification-realm.json:ro
    networks: [application]
  identity-tls:
    image: caddy:2
    network_mode: service:jarvis-api
    volumes:
      - ../../tests/e2e/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../artifacts/verification/certs:/certs:ro
    depends_on:
      jarvis-api:
        condition: service_started
      identity:
        condition: service_started
  telemetry:
    image: otel/opentelemetry-collector-contrib:0.141.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ../../tests/e2e/otel-collector.yml:/etc/otel-collector.yml:ro
    networks: [application]
  jarvis-api:
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4317
      OTEL_METRIC_EXPORT_INTERVAL: 5000
      Coding__Repositories__0__Name: verification
      Coding__Repositories__0__Path: /coding/fixture
      Coding__WorktreeRoot: /coding/worktrees
      Mcp__Servers__0__Name: verification
      Mcp__Servers__0__Transport: stdio
      Mcp__Servers__0__Command: /usr/local/bin/node
      Mcp__Servers__0__Arguments__0: /verification/fake_mcp.mjs
      Mcp__Servers__0__AllowedTools__0: github_create_issue
      Mcp__Servers__0__AllowedTools__1: search_docs
      Mcp__Servers__0__AutoApprovedTools__0: search_docs
      Mcp__Servers__0__CredentialProvider: verification
      Mcp__Servers__0__CredentialEnvironmentVariables__TEST_TOKEN: token
    volumes:
      - ../../tests/e2e:/verification:ro
      - ../../artifacts/verification/coding:/coding
  jarvis-worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4317
      OTEL_METRIC_EXPORT_INTERVAL: 5000
      Mcp__Servers__0__Name: verification
      Mcp__Servers__0__Transport: stdio
      Mcp__Servers__0__Command: /usr/local/bin/node
      Mcp__Servers__0__Arguments__0: /verification/fake_mcp.mjs
      Mcp__Servers__0__AllowedTools__0: github_create_issue
      Mcp__Servers__0__AllowedTools__1: search_docs
      Mcp__Servers__0__AutoApprovedTools__0: search_docs
      Mcp__Servers__0__CredentialProvider: verification
      Mcp__Servers__0__CredentialEnvironmentVariables__TEST_TOKEN: token
    volumes:
      - ../../tests/e2e:/verification:ro
