# Adds production account authentication to the disposable local stack.
services:
  jarvis-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrationsAtStartup: "true"
      Authentication__Issuer: https://jarvis.local
      Authentication__Audience: jarvis-api
      Authentication__SigningKey: verification-signing-key-at-least-32b
      Authentication__AllowRegistration: "true"
