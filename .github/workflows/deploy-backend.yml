name: Deploy backend

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional extra image tag in addition to the git SHA.
        required: false
        type: string
      skip_deploy:
        description: Build and push images without SSHing to the server.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - name: Image prefix
        id: meta
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create deployment source bundle
        run: git bundle create "${RUNNER_TEMP}/jarvis-source.bundle" HEAD

      - name: Upload deployment source bundle
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-deployment-source
          path: ${{ runner.temp }}/jarvis-source.bundle
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: infra/compose/Dockerfile
            build-args: PROJECT_PATH=src/Jarvis.Api/Jarvis.Api.csproj
          - name: worker
            dockerfile: infra/compose/Dockerfile
            build-args: PROJECT_PATH=workers/Jarvis.Worker/Jarvis.Worker.csproj
          - name: voice-worker
            dockerfile: workers/voice/Dockerfile
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag uses SemVer
        if: github.ref_type == 'tag'
        run: python3 scripts/release/semver.py --parse-tag "${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.prefix }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [prepare, build, source]
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true) &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: [self-hosted, linux, x64, jarvis-deploy]
    environment: production
    steps:
      - name: Download deployment source bundle
        uses: actions/download-artifact@v4
        with:
          name: jarvis-deployment-source
          path: ${{ runner.temp }}

      - name: Deploy on the server runner
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GIT_SHA: ${{ github.sha }}
          SOURCE_BUNDLE: ${{ runner.temp }}/jarvis-source.bundle
          JARVIS_API_IMAGE: ${{ needs.prepare.outputs.prefix }}/api:${{ github.sha }}
          JARVIS_WORKER_IMAGE: ${{ needs.prepare.outputs.prefix }}/worker:${{ github.sha }}
          JARVIS_VOICE_WORKER_IMAGE: ${{ needs.prepare.outputs.prefix }}/voice-worker:${{ github.sha }}
          DEPLOY_COMPOSE_FILES: ${{ vars.DEPLOY_COMPOSE_FILES }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          if [[ ! -d .git ]]; then
            git init
          fi
          git fetch --force "${SOURCE_BUNDLE}" HEAD
          git checkout --detach --force "${GIT_SHA}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          chmod +x scripts/deploy/remote-up.sh
          scripts/deploy/remote-up.sh
