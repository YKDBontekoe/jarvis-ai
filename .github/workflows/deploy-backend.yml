name: Deploy backend
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional extra tag for the verified images.
        required: false
        type: string
      skip_deploy:
        description: Publish verified images without deploying.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-backend
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
  source:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: git bundle create "$RUNNER_TEMP/jarvis-source.bundle" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: jarvis-deployment-source, path: '${{ runner.temp }}/jarvis-source.bundle', if-no-files-found: error, retention-days: 7}
  publish:
    name: Promote tested image artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release identity
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/release/semver.py --parse-tag "$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual releases must use main or a SemVer release tag.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: verified-image-*, path: artifacts/images, merge-multiple: true}
      - run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Authenticate registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish by immutable digest
        env:
          EXTRA_IMAGE_TAG: ${{ inputs.image_tag }}
        run: python3 scripts/ci/publish-images.py artifacts/images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-release-manifest
          path: artifacts/images/release-manifest.json
          retention-days: 90
          if-no-files-found: error
  sentry-release:
    name: Associate Sentry release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: verified-image-*, path: artifacts/images, merge-multiple: true}
      - run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Detect Sentry credentials
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_BACKEND }}
        run: |
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload symbols from verified image artifacts
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_BACKEND }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: scripts/ci/upload-sentry-symbols.sh
      - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_BACKEND }}
        with:
          environment: production
          release: ${{ github.sha }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true
  deploy:
    needs: [verify, publish, source, sentry-release]
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true) &&
      (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: [self-hosted, linux, x64, jarvis-deploy]
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: jarvis-deployment-source, path: '${{ runner.temp }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: jarvis-release-manifest, path: '${{ runner.temp }}'}
      - name: Deploy verified release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GIT_SHA: ${{ github.sha }}
          SOURCE_BUNDLE: ${{ runner.temp }}/jarvis-source.bundle
          RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest.json
          DEPLOY_COMPOSE_FILES: ${{ vars.DEPLOY_COMPOSE_FILES }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [[ ! -d .git ]]; then git init; fi
          git fetch --force "$SOURCE_BUNDLE" HEAD
          git checkout --detach --force "$GIT_SHA"
          python3 scripts/deploy/manifest-env.py "$RELEASE_MANIFEST" > "$RUNNER_TEMP/jarvis-images.env"
          set -a
          source "$RUNNER_TEMP/jarvis-images.env"
          set +a
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          scripts/deploy/remote-up.sh
