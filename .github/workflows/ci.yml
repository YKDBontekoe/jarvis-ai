name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Jarvis.sln

      - name: Build
        run: dotnet build Jarvis.sln --configuration Release --no-restore

      - name: Verify EF migrations match the model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Jarvis.Infrastructure/Jarvis.Infrastructure.csproj
          --startup-project src/Jarvis.Api/Jarvis.Api.csproj

      - name: Unit tests
        run: >-
          dotnet test tests/unit/Jarvis.UnitTests/Jarvis.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jarvis.sln

      - name: Build
        run: dotnet build Jarvis.sln --configuration Release --no-restore

      - name: Integration tests
        run: >-
          dotnet test tests/integration/Jarvis.IntegrationTests/Jarvis.IntegrationTests.csproj
          --configuration Release
          --verbosity normal

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python unit tests
        run: scripts/ci/run-python-unit-tests.sh

  whatsapp-bridge:
    name: WhatsApp bridge tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/whatsapp-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  mobile:
    name: Mobile analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build hosted web client
        working-directory: .
        run: bash scripts/ci/build-web.sh

      - name: Stage public web files
        working-directory: .
        run: bash scripts/ci/stage-web.sh

      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-web-client
          path: infra/web/dist/
          if-no-files-found: error
          retention-days: 1

  container-images:
    name: Container image (${{ matrix.name }})
    needs: mobile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/compose/Dockerfile
            build-args: PROJECT_PATH=src/Jarvis.Api/Jarvis.Api.csproj
          - name: worker
            dockerfile: infra/compose/Dockerfile
            build-args: PROJECT_PATH=workers/Jarvis.Worker/Jarvis.Worker.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download hosted web client
        if: matrix.name == 'api'
        uses: actions/download-artifact@v4
        with:
          name: jarvis-web-client
          path: infra/web/dist

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: |
            ${{ matrix.build-args }}
            REQUIRE_WEB_CLIENT=${{ matrix.name == 'api' }}
          tags: jarvis-ci-${{ matrix.name }}:test
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  required:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - backend
      - integration
      - python
      - mobile
      - container-images
    if: always()
    steps:
      - name: Require successful jobs
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::Job $name finished with $result"
              exit 1
            fi
          }
          check backend "${{ needs.backend.result }}"
          check integration "${{ needs.integration.result }}"
          check python "${{ needs.python.result }}"
          check mobile "${{ needs.mobile.result }}"
          check container-images "${{ needs.container-images.result }}"
