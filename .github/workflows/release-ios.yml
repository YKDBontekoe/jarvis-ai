name: Release iOS IPA

# Tag releases are started by release.yml with skip_publish so this workflow
# builds the IPA only. A manual run still publishes after the production approval.

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer marketing version (MAJOR.MINOR.PATCH). Defaults to apps/mobile/pubspec.yaml.
        required: false
        type: string
      skip_publish:
        description: Build the IPA and GitHub Release without updating AltStore on the server.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ipa:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag uses SemVer
        if: github.ref_type == 'tag'
        run: python3 scripts/release/semver.py --parse-tag "${GITHUB_REF_NAME}"

      - name: Resolve SemVer release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/semver.py \
            --ref-type "${GITHUB_REF_TYPE}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --input-version "${INPUT_VERSION}" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --github-output

      - name: Sync Flutter pubspec version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          python3 scripts/release/semver.py \
            --write-pubspec \
            --version "${VERSION}" \
            --build "${BUILD}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart/Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build unsigned iOS app
        working-directory: apps/mobile
        env:
          JARVIS_API_URL: ${{ secrets.JARVIS_API_URL }}
          JARVIS_FIREBASE_API_KEY: ${{ secrets.JARVIS_FIREBASE_API_KEY }}
          JARVIS_FIREBASE_PROJECT_ID: ${{ secrets.JARVIS_FIREBASE_PROJECT_ID }}
          JARVIS_FIREBASE_SENDER_ID: ${{ secrets.JARVIS_FIREBASE_SENDER_ID }}
          JARVIS_FIREBASE_IOS_APP_ID: ${{ secrets.JARVIS_FIREBASE_IOS_APP_ID }}
          JARVIS_FIREBASE_IOS_BUNDLE_ID: ${{ secrets.JARVIS_FIREBASE_IOS_BUNDLE_ID }}
          JARVIS_FIREBASE_STORAGE_BUCKET: ${{ secrets.JARVIS_FIREBASE_STORAGE_BUCKET }}
          JARVIS_SENTRY_DSN: ${{ secrets.JARVIS_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_MOBILE }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          DEFINES=()
          add_define() {
            local name="$1"
            local value="$2"
            if [[ -n "${value}" ]]; then
              DEFINES+=(--dart-define="${name}=${value}")
            fi
          }
          add_define JARVIS_API_URL "${JARVIS_API_URL}"
          add_define JARVIS_FIREBASE_API_KEY "${JARVIS_FIREBASE_API_KEY}"
          add_define JARVIS_FIREBASE_PROJECT_ID "${JARVIS_FIREBASE_PROJECT_ID}"
          add_define JARVIS_FIREBASE_SENDER_ID "${JARVIS_FIREBASE_SENDER_ID}"
          add_define JARVIS_FIREBASE_IOS_APP_ID "${JARVIS_FIREBASE_IOS_APP_ID}"
          add_define JARVIS_FIREBASE_IOS_BUNDLE_ID "${JARVIS_FIREBASE_IOS_BUNDLE_ID}"
          add_define JARVIS_FIREBASE_STORAGE_BUCKET "${JARVIS_FIREBASE_STORAGE_BUCKET}"
          add_define JARVIS_SENTRY_DSN "${JARVIS_SENTRY_DSN}"
          SYMBOLS=()
          if [[ -n "${SENTRY_AUTH_TOKEN}" && -n "${SENTRY_ORG}" && -n "${SENTRY_PROJECT}" ]]; then
            # gen_snapshot does not create the map's parent directory; iOS builds do not create build/app.
            mkdir -p build/app build/symbols
            SYMBOLS=(
              "--split-debug-info=${PWD}/build/symbols"
              --obfuscate
              "--extra-gen-snapshot-options=--save-obfuscation-map=${PWD}/build/app/obfuscation.map.json"
            )
          fi
          flutter build ios --release --no-codesign \
            --build-name="${VERSION}" \
            --build-number="${BUILD}" \
            ${SYMBOLS[@]+"${SYMBOLS[@]}"} \
            ${DEFINES[@]+"${DEFINES[@]}"}
          if [[ ${#SYMBOLS[@]} -gt 0 ]]; then
            export SENTRY_RELEASE="${VERSION}+${BUILD}"
            export SENTRY_DIST="${BUILD}"
            dart run sentry_dart_plugin \
              --sentry-define=release="${SENTRY_RELEASE}" \
              --sentry-define=dist="${SENTRY_DIST}" \
              --sentry-define=commits=auto \
              --sentry-define=ignore_missing=true
          else
            echo "Sentry symbols were not uploaded; SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT_MOBILE is unset."
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="apps/mobile/build/ios/iphoneos/Runner.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Unsigned Runner.app was not produced at ${APP_PATH}" >&2
            exit 1
          fi
          mkdir -p dist
          chmod +x scripts/ios/package_unsigned_ipa.sh
          scripts/ios/package_unsigned_ipa.sh "${APP_PATH}" dist/Jarvis.ipa

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jarvis ${{ steps.version.outputs.version }}
          body: |
            Unsigned `Jarvis.ipa` for [AltStore Classic](https://altstore.io/) (signed by AltServer during installation) or [LiveContainer](https://github.com/LiveContainer/LiveContainer).
            Add the Jarvis source to AltStore Classic, or download the IPA from this release and import it in LiveContainer.
          generate_release_notes: true
          files: dist/Jarvis.ipa

      - name: Upload IPA artifact for server publishing
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-altstore-ipa
          path: dist/Jarvis.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Record release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          printf '{"version":"%s","build":"%s"}\n' "${VERSION}" "${BUILD}" > dist/release-meta.json

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-meta
          path: dist/release-meta.json
          if-no-files-found: error
          retention-days: 90

  publish-source:
    needs: release-ipa
    if: >-
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.skip_publish != true &&
      inputs.skip_publish != 'true'
    runs-on: [self-hosted, linux, x64, jarvis-deploy]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-altstore-ipa
          path: dist

      - name: Publish IPA and source JSON on the server
        env:
          VERSION: ${{ needs.release-ipa.outputs.version }}
          BUILD_VERSION: ${{ needs.release-ipa.outputs.build }}
          ALTSTORE_CONTENT_DIR: /home/ykdbonte/.jarvis/altstore
          SOURCE_BASE_URL: https://jarvis.ykdbonte.dev/altstore
        run: bash scripts/altstore/publish_release.sh
